# Elora - application.properties (Spring Boot 3.2 + MySQL 8 - elora_schema_v2.sql)
server.port=8080
server.servlet.context-path=/api

# MySQL - ajuste para seu Codespace/Docker
# (sem characterEncoding: o valor 'utf8mb4' não é um charset Java válido e o
# driver rejeita a conexão; o MySQL já negocia utf8mb4 via collation do banco)
spring.datasource.url=jdbc:mysql://localhost:3306/elora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - V2 usa create apenas se banco vazio; em prod use validate + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# Security - defina no Codespace Secrets / .env
# Para dev local há um fallback em JwtService; em prod DEFINA esta prop.
app.jwt.secret=${JWT_SECRET:Q2hhbmdlTWVfMzJfQ2hhcnNfTWluX0Rldl9TZWNyZXRfMTIzNDU2Nzg=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# OpenAPI (Swagger UI em /api/swagger-ui.html por causa do context-path)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.com.elora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
